[project]
name = "whisper-local"
version = "0.1.0"
description = "Hold a key, speak, and the words appear where you type. Transcribed by Qwen3-ASR on the local network."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sounddevice",
]

[project.scripts]
whisper-local = "whisper_local.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
